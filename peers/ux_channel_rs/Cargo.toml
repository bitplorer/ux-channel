[package]
name = "ux_channel_rs"
version = "0.1.0"
edition = "2021"
description = "Rust peer for ux-channel IR 0.1 — Intent / Result / ops / caps / CXB"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
flate2 = "1"
hex = "0.4"
tiny_http = "0.12"
crc32fast = "1.4"
rmp-serde = "1.3"

[lib]
name = "ux_channel_rs"
path = "src/lib.rs"

[[bin]]
name = "uxc_check"
path = "src/bin/uxc_check.rs"

[[bin]]
name = "uxc_peer"
path = "src/bin/uxc_peer.rs"
