name: Bug report
description: Intent, Cap, Result, or host dispatch does not match the freeze.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: {label: Version / commit}
    validations: {required: true}
  - type: dropdown
    id: extra
    attributes:
      label: Extra
      options: [none, asgi, cek, redis, full]
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (redact Caps)
      render: python
    validations: {required: true}
