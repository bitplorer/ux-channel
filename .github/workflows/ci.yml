name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: law + layout + python gate + rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Python host test deps
        run: python3 -m pip install -q -r requirements-dev.txt

      - name: Repo health (links, stale paths, required files)
        run: python3 scripts/repo_health.py

      - name: Full verify
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: ./verify.sh

      # Live HTTP is flaky in some runners if port binds fail; still run when possible
      - name: Live HTTP smoke
        run: ./verify.sh --http

  verify-sec:
    name: security residuals (not the default gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python host test deps
        run: python3 -m pip install -q -r requirements-dev.txt
      - name: make verify-sec
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: make verify-sec

  keep-value-browser:
    name: keep-value chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python host test deps
        run: python3 -m pip install -q -r requirements-dev.txt

      # jsdom and idiomorph only. The browser is the runner's google-chrome-stable.
      - name: Test dependencies
        working-directory: python/tests/gate/js_keep_value
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Chrome
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome)"
          test -n "$chrome"
          echo "Chrome version: $($chrome --version)"

      - name: Keep-value Chromium
        working-directory: python
        env:
          UX_KEEP_VALUE_REQUIRE_BROWSER: "1"
          PYTHONPATH: src
        run: python3 -m pytest tests/gate/test_keep_value.py -s --tb=short

  verify-chrome:
    name: chrome payloads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
          google-chrome --version
      - name: Install Python host test deps
        run: python3 -m pip install -q -r requirements-dev.txt
      - name: Chrome tests (fail if any skip)
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
          UX_CHANNEL_REQUIRE_CHROME: "1"
        run: |
          python3 -m pytest \
            python/tests/gate/test_chrome_payload_routes.py \
            python/tests/gate/test_chrome_navigate_style.py \
            python/tests/gate/test_review_r7_animate.py::test_chrome_animate_payloads_do_not_run_with_the_client_guard_off \
            python/tests/gate/test_review_r7_morph_guard.py \
            -q --tb=line -ra
