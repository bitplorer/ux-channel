name: land-door-h

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client/closed-core-doors
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Door H patch onto main runtime copy
        run: |
          set -euo pipefail
          MIN=python/src/ux_channel/static/ux-channel.min.js
          JS=python/src/ux_channel/static/ux-channel.js
          PATCH=python/src/ux_channel/static/door-h.patch
          test -s "$MIN"
          test -s "$PATCH"
          cp "$MIN" "$JS"
          patch -p1 < "$PATCH"
          cp "$JS" "$MIN"
          rm -f "$PATCH" .github/workflows/land-door-h.yml
          git config user.name "bitplorer"
          git config user.email "89827197+bitplorer@users.noreply.github.com"
          git add "$JS" "$MIN"
          git add -u
          git commit -m "client: restore closed-core runtime (Door H + persist silent hydrate + SIG_PREFIX fix)"
          git push origin client/closed-core-doors
